name: CMake Modern CI (VS2022 / C++20)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Release, Debug]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC Dev Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.config }}

    - name: Build JPEGView
      run: |
        cmake --build build --config ${{ matrix.config }} --parallel

    - name: Upload Artifacts (Release)
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: JPEGView-Modern-x64-Release
        path: |
          build/bin/Release/*.exe
          build/bin/Release/*.dll
